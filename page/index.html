<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dither wallpaper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1013; }
  .bg {
    position: fixed; inset: 0;
    background: #0b1013 url("bg.jpg") center / cover no-repeat;
  }
  /* same darkening as the j551n.com hero */
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(8,12,14,.92) 0%, rgba(8,12,14,.78) 55%, rgba(8,12,14,.82) 100%),
      radial-gradient(120% 90% at 50% 50%, rgba(0,71,179,.12), transparent 62%);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="bg"><div class="shade"><canvas></canvas></div></div>
<script type="module">
  import { createField, hex } from "./field.js";

  const canvas = document.querySelector("canvas");
  const field = createField(canvas, { cell: 4, dot: 2, tint: hex("#c4c8cc"), intensity: .5, angle: 84, radius: 80, cursor: false });
  const r = canvas.getBoundingClientRect();
  field.resize(r.width, r.height);

  // render.mjs steps through exact frames; opened in a browser it just plays
  window.drawAt = (t) => field.draw(t);
  window.fieldReady = !!field;
  if (!navigator.webdriver) field.setRunning(true);
</script>
</body>
</html>
